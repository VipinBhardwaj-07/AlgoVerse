name: Daily Developer Activity

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily developer log
        run: |
          mkdir -p .github
          echo "- $(date -u '+%Y-%m-%d') — Daily development activity" >> .github/daily-dev-log.md

      - name: Commit daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/daily-dev-log.md
          git diff --cached --quiet || git commit -m "chore: daily developer activity"
          git push
